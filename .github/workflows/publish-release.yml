name: Publish verified release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'crystalstrategysup-prog/agent-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned build tools
        run: python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0
      - name: Verify tag and public source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
          python tools/verify_public.py
      - name: Build exact reviewed bytes
        run: python tools/release_package.py --output dist-public
      - name: Publish or reconcile release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          python tools/publish_release.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --assets dist-public
