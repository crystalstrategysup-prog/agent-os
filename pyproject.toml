[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-agent-os"
version = "0.5.1"
description = "Documentation-first, local-first foundation for governed project agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Crystal Strategy Community"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.16,<1"]
speech = ["openai>=2.0"]

[project.scripts]
agentos = "agent_os.cli:main"
agentos-hook = "agent_os.hooks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_os = ["resources/**/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
